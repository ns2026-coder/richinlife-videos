<!doctype html><html><body style="margin:0;background:#000"><canvas id=c width=1080 height=1920></canvas><script>

const v=(r,y)=>10000*Math.pow(1+r,y);const px=y=>CX+CW*y/30,py=m=>CY-CH*(m-0)/YMAX;

  for(let i=0;i<6;i++){const k=out(p(t,12.9+i*.28,.3));const h=v(.06,i*6)/60000*CH*k;rr(px(i*6)-30,CY-h,60,h,8,`rgba(34,197,94,${.35+i*.1})`);if(k>0)txt('+6%',px(i*6),CY-h-26,28,G,700)}}
 else {line(.06,G,g);const val=v(.06,g);txt(gbp(round100(val)),540,240,110,G,800);txt('Year '+Math.round(g),540,330,44,M,600)}}
function fee(t){ // slider + red race
 axes();line(.06,G,30);const a=t-19.9;
 const dx=out(p(a,.5,1.0));rr(160,190,760,130,26,P,L);txt('Yearly fee',210,222,32,M,500,'left');txt((dx).toFixed(1)+'%',860,255,54,dx>.05?R:W,800,'right');
 rr(210,272,500,14,7,L);rr(210,272,500*dx,14,7,R);x.beginPath();x.arc(210+500*dx,279,24,0,7);x.fillStyle=W;x.fill();if(a<1.55)finger(210+500*dx+6,296,a<.5?tapAt(a,0.05):.25);

function gap(t){const a=t-24.3;if(t<28){axes();line(.06,G,30);line(.05,R,30);
 const X=px(30)+0,y1=py(v(.06,30)),y2=py(v(.05,30));const k=out(p(a,.1,.5));x.fillStyle='rgba(239,68,68,.24)';x.beginPath();for(let y=30;y>=30-30*k;y-=.5){x.lineTo(px(y),py(v(.06,y)))}for(let y=30-30*k;y<=30;y+=.5){x.lineTo(px(y),py(v(.05,y)))}x.fill();
 const n=out(p(a,.5,1.6))*14216;sc(540,260,1+.05*Math.sin(a*6),()=>{txt('The extra fee costs',540,190,48,W,600);txt(a<2.2?gbp(n):'over £14,000',540,290,a<2.2?120:104,R,800)});
 for(let i=0;i<9;i++){const q=(a-.8-i*.26);if(q<0||q>1)continue;const K=out(q);coin(px(27)-K*30,y1+(y2-y1+200)*K,26,Y,q*8)}
 return}
 // compounding: each year's fee stacks on itself
 const b=t-27.9;txt('Fees compound too',540,250,76,R,800);const pos=(i)=>210+i*165;for(let i=0;i<5;i++){const k=out(p(b,.25+i*.42,.32));const yr=[1,5,10,20,30][i],gp=v(.06,yr)-v(.05,yr),h=Math.max(8,gp/14216*600)*k;rr(pos(i)-52,1020-h,104,h,10,R);fade(k,()=>{txt('Yr '+yr,pos(i),1060,30,M,600);txt('£'+Math.round(gp/100)*100>='£'?gbp(Math.round(gp/100)*100):'',pos(i),1020-h-30,30,W,700)})}
 fade(p(b,2.1,.3),()=>txt('Growth snowballs. So do charges.',540,1180,44,W,600))}
function statement(t){const a=t-31.4;const up=out(p(a,0,.35));x.save();x.translate(0,(1-up)*1000);rr(120,210,840,920,26,'#f3f6fb');txt('Your yearly charges',540,290,50,'#0a1228',800);
 const rows=[['Platform fee',35.1],['Fund fee',36.4],['Other costs',37.3]];rows.forEach((r,i)=>{const yy=410+i*135;const on=t>=r[1];rr(170,yy,740,104,16,on?'#dcfce7':'#e6eaf3');txt(r[0],210,yy+52,44,'#0a1228',600,'left');x.beginPath();x.arc(850,yy+52,30,0,7);x.fillStyle=on?G:'#c4ccdb';x.fill();if(on){x.strokeStyle='#fff';x.lineWidth=8;x.beginPath();x.moveTo(835,yy+52);x.lineTo(847,yy+66);x.lineTo(868,yy+38);x.stroke()}});
 txt('Total yearly charges: check yours',540,860,38,'#0a1228',700);
 for(let i=0;i<3;i++)rr(210,930+i*26,i==2?420:660,10,5,'#c4ccdb');
 x.restore();
 const tgt=t<35.1?[860,300]:t<36.4?[850,520]:t<37.3?[850,650]:[850,790];const pr=[35.1,36.4,37.3].map(q=>tapAt(t,q-.1)).reduce((u,w)=>Math.max(u,w),0);if(t<37.9&&a>1)finger(tgt[0],tgt[1]-20,pr);
 if(t>=37.9){const m=out(p(t,37.9,.45));const cx=420,cy=955;x.save();x.beginPath();x.arc(cx,cy,180*m,0,7);x.fillStyle='#fff7d6';x.fill();x.strokeStyle='#0a1228';x.lineWidth=16;x.stroke();x.clip();txt('small print',cx,cy,60,'#0a1228',700);x.restore();x.strokeStyle='#0a1228';x.lineWidth=26;x.lineCap='round';x.beginPath();x.moveTo(cx+130*m,cy+130*m);x.lineTo(cx+230*m,cy+230*m);x.stroke();x.lineCap='butt';}}
function picture(t){if(t<41.5){const a=t-39.9;txt('Lower cost',540,420,92,G,800);sc(540,600,pop(a,.3),()=>{txt('≠',540,600,150,Y,800)});sc(540,790,pop(a,.6),()=>txt('Lower risk',540,790,92,R,800));return}
 if(t<44.2){const a=t-41.5;txt('Fees are just one part',540,300,62,W,700);const tile=['Fees','Risk','Time','Goals'];tile.forEach((q,i)=>{const X=240+(i%2)*320,Y2=420+Math.floor(i/2)*320;const k=pop(a,.1+i*.22);sc(X+150,Y2+140,k,()=>{rr(X,Y2,300,280,24,i==0?Y:P,i==0?null:L);txt(q,X+150,Y2+140,62,i==0?'#3c2a05':M,800)})});return}
